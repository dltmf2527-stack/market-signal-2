<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>분할매수 신호판</title>

  <style>
    body {
      max-width: 650px;
      margin: 0 auto;
      padding: 18px;

      background: #0f1115;
      color: #e8eaed;

      font-family:
        Arial,
        "Malgun Gothic",
        sans-serif;

      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 10px 0 22px;
    }

    h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 5px 0 0;
      color: #9aa1ad;
      font-size: 12px;
    }

    #signal {
      margin-bottom: 12px;
      padding: 25px;

      background: #181b22;
      border: 1px solid #2a2f3a;
      border-radius: 16px;

      text-align: center;
    }

    #signal.go {
      background: #24191d;
      border-color: #ef4444;
    }

    .emoji {
      font-size: 42px;
    }

    .title {
      margin-top: 7px;
      font-size: 21px;
      font-weight: bold;
    }

    .sub {
      margin-top: 6px;
      color: #9aa1ad;
      font-size: 12px;
    }

    .reason {
      display: inline-block;
      margin-top: 12px;

      color: #9aa1ad;
      font-size: 12px;
      text-align: left;
    }

    .card {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 9px;
      padding: 14px;

      background: #181b22;
      border: 1px solid #2a2f3a;
      border-radius: 14px;
    }

    .card-label {
      font-size: 15px;
    }

    .card-sub {
      margin-top: 3px;
      color: #9aa1ad;
      font-size: 11px;
    }

    .card-value {
      font-size: 24px;
      font-weight: bold;
      white-space: nowrap;
    }

    .source {
      color: #22c55e;
    }

    table {
      width: 100%;
      margin: 13px 0;

      background: #181b22;
      border-collapse: collapse;
      border-radius: 14px;
      overflow: hidden;

      font-size: 12px;
    }

    th,
    td {
      padding: 10px 5px;
      border-top: 1px solid #2a2f3a;
      text-align: center;
    }

    th {
      color: #9aa1ad;
    }

    tr.hit {
      background: #3a1f24;
      font-weight: bold;
    }

    button {
      width: 100%;
      margin-bottom: 10px;
      padding: 13px;

      background: #20242d;
      color: #e8eaed;

      border: 1px solid #2a2f3a;
      border-radius: 12px;

      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      margin-bottom: 10px;
      padding: 14px;

      background: #181b22;
      border: 1px solid #2a2f3a;
      border-radius: 14px;

      color: #9aa1ad;
      font-size: 12px;
    }

    .note b {
      color: #e8eaed;
    }

    #error {
      display: none;

      margin-bottom: 10px;
      padding: 12px;

      background: #2b2416;
      color: #e7c65a;

      border: 1px solid #6b5520;
      border-radius: 12px;

      font-size: 12px;
    }

    #status {
      padding: 8px 0 20px;
      color: #9aa1ad;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1>📊 분할매수 신호판</h1>

    <p>
      CNN 공포탐욕 · VIX · 나스닥100 자동 갱신
    </p>
  </header>


  <div id="signal">
    <div class="emoji">⏳</
