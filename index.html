<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#0f1115"
  >

  <title>분할매수 신호판</title>

  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --line: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa1ad;
      --green: #22c55e;
      --orange: #f97316;
      --red: #ef4444;
      --warn: #e7c65a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 660px;
      margin: 0 auto;
      padding: 18px;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

      line-height: 1.55;
    }

    header {
      text-align: center;
      padding: 8px 0 22px;
    }

    h1 {
      font-size: 23px;
      margin: 0;
    }

    header p {
      font-size: 12px;
      color: var(--muted);
      margin: 5px 0 0;
    }

    .panel,
    .card,
    .note,
    .warning {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 15px;
    }

    .panel {
      padding: 25px;
      text-align: center;
      margin-bottom: 12px;
    }

    .panel.go {
      border-color: var(--red);
      background: #24191d;
    }

    .emoji {
      font-size: 42px;
    }

    .title {
      font-size: 21px;
      font-weight: 800;
      margin-top: 8px;
    }

    .sub,
    .small {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .reasons {
      display: inline-block;
      text-align: left;
      margin-top: 12px;
    }

    .warning {
      padding: 12px 14px;
      margin-bottom: 10px;
      color: var(--warn);
      font-size: 12px;
    }

    .card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      padding: 14px;
      margin-bottom: 9px;
    }

    .card strong {
      font-size: 24px;
      white-space: nowrap;
    }

    .live {
      color: var(--green);
    }

    .stale {
      color: var(--orange);
    }

    table {
      width: 100%;
      border-collapse: collapse;

      background: var(--card);
      border-radius: 14px;
      overflow: hidden;

      margin: 13px 0;
      font-size: 12px;
    }

    th,
    td {
      border-top: 1px solid var(--line);
      padding: 10px 5px;
      text-align: center;
    }

    th {
      color: var(--muted);
    }

    tr.hit {
      background: #3a1f24;
      font-weight: 700;
    }

    button {
      width: 100%;

      padding: 13px;
      margin-bottom: 10px;

      border: 1px solid var(--line);
      border-radius: 12px;

      background: #20242d;
      color: var(--text);

      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .note {
      padding: 14px;
      margin-bottom: 10px;

      color: var(--muted);
      font-size: 12px;
    }

    .note b {
      color: var(--text);
    }

    #status {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 8px 0 20px;
    }
  </style>
</head>
