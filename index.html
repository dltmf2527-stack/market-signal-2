<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#0f1115"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <title>분할매수 신호판</title>

  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --card2: #1f232c;
      --line: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa1ad;
      --green: #22c55e;
      --orange: #f97316;
      --red: #ef4444;
      --warning-bg: #2b2416;
      --warning-line: #6b5520;
      --warning-text: #e7c65a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

      max-width: 650px;
      margin: 0 auto;
      padding: 16px;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 16px 0 22px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 800;
    }

    header p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    #signal {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;

      text-align: center;
      padding: 26px 20px;
      margin-bottom: 14px;
    }

    #signal.go {
      background: #24191d;
      border-color: var(--red);
    }

    .signalEmoji {
      font-size: 42px;
    }

    .signalTitle {
      font-size: 21px;
      font-weight: 800;
      margin-top: 8px;
    }

    .signalSub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 7px;
    }

    .signalReason {
      color: var(--muted);
      font-size: 12px;
      text-align: left;

      display: inline-block;
      margin-top: 12px;
    }

    .warning {
      background: var(--warning-bg);
      border: 1px solid var(--warning-line);
      border-radius: 12px;

      color: var(--warning-text);
      font-size: 12px;

      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;

      padding: 15px;
      margin-bottom: 10px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .cardTitle {
      font-size: 15px;
    }

    .cardSub {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .cardValue {
      font-size: 23px;
      font-weight: 800;
      white-space: nowrap;
    }

    .live {
      color: var(--green);
    }

    .stale {
      color: var(--orange);
    }

    table {
      width: 100%;
      border-collapse: collapse;

      background: var(--card);
      border-radius: 14px;
      overflow: hidden;

      margin: 14px 0;
      font-size: 12px;
    }

    th,
    td {
      border-top: 1px solid var(--line);
      padding: 10px 5px;
      text-align: center;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    tr.hit {
      background: #3a1f24;
      font-weight: 700;
    }

    button {
      width: 100%;

      background: var(--card2);
      color: var(--text);

      border: 1px solid var(--line);
      border-radius: 12px;

      padding: 13px;
      margin-bottom: 10px;

      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }

    .note {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;

      padding: 15px;
      margin-bottom: 12px;

      color: var(--muted);
      font-size: 12px;
    }

    .note b {
      color: var(--text);
    }

    .note ol {
      margin: 8px 0 0 18px;
    }

    .note li {
      margin: 5px 0;
    }

    #status {
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      padding: 8px 0 24px;
    }
  </style>
</head>


<body>

    function formatNumber(value) {
      if (
        value === null ||
        value === undefined ||
        Number.isNaN(Number(value))
      ) {
        return "–";
      }

      return Math.round(
        Number(value)
      ).toLocaleString("ko-KR");
    }


    function roundOne(value) {
      return Math.round(
        Number(value) * 10
      ) / 10;
    }


    async function fetchWithTimeout(
      url,
      options,
      timeoutMs
    ) {
      const controller =
        new AbortController();

      const timer =
        setTimeout(
          function () {
            controller.abort();
          },
          timeoutMs
        );

      try {
        return await fetch(
          url,
          {
            ...options,
            signal: controller.signal
          }
        );

      } finally {
        clearTimeout(timer);
      }
    }
