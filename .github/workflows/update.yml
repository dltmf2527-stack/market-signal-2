name: 지표 자동 업데이트

on:
  schedule:
    - cron: "30 21 * * 1-5"
    - cron: "0 3 * * 2-6"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 문법 검사
        run: python -m py_compile update.py

      - name: 지표 수집
        run: python update.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "지표 자동 업데이트"
            git push
          fi
